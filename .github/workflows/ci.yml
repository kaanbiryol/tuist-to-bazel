name: ci

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift:
    name: swift test
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Swift tests
        run: swift test

      - name: Build release executable
        run: swift build -c release

  bazel-showcase:
    name: bazel showcase
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      USE_BAZEL_VERSION: 9.1.0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bazelisk
        run: brew install bazelisk

      - name: Query showcase
        working-directory: Examples/generated_ios_app_with_framework_and_resources
        run: bazelisk query //...

      - name: Build showcase
        working-directory: Examples/generated_ios_app_with_framework_and_resources
        run: bazelisk build //...

  fixture-smoke:
    name: fixture smoke (${{ matrix.fixture }})
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      USE_BAZEL_VERSION: 9.1.0
      REUSE_GLOBAL_SIMULATOR: "1"
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - generated_app_with_framework_and_tests
          - generated_ios_app_with_framework_and_resources
          - generated_ios_app_with_xcframeworks
          - generated_app_with_local_spm_module_with_remote_dependencies
          - generated_multiplatform_app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned tools
        uses: jdx/mise-action@v2

      - name: Install Bazelisk
        run: brew install bazelisk

      - name: Build converter
        run: swift build -c release

      - name: Verify fixture
        run: scripts/verify-tuist-fixtures.sh --skip-tests "${{ matrix.fixture }}"

  fixture-list:
    name: supported fixture list
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      fixtures: ${{ steps.fixtures.outputs.value }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read supported fixtures
        id: fixtures
        run: echo "value=$(jq -c '[.fixtures[] | select(.expectedStatus == \"supported\") | .name]' Fixtures/manifest.json)" >> "$GITHUB_OUTPUT"

  fixture-full:
    name: full fixture (${{ matrix.fixture }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: fixture-list
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      USE_BAZEL_VERSION: 9.1.0
      REUSE_GLOBAL_SIMULATOR: "1"
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        fixture: ${{ fromJSON(needs.fixture-list.outputs.fixtures) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned tools
        uses: jdx/mise-action@v2

      - name: Install Bazelisk
        run: brew install bazelisk

      - name: Build converter
        run: swift build -c release

      - name: Verify fixture
        run: scripts/verify-tuist-fixtures.sh "${{ matrix.fixture }}"
